<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" width="300" height="120">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Yellow ribbon banner -->
  <path d="M 40 50 Q 60 30, 100 35 L 250 35 Q 270 30, 280 50 L 275 85 Q 270 95, 250 92 L 100 92 Q 60 95, 40 85 Z" fill="url(#yellowGrad)" stroke="#1a1a1a" stroke-width="2.5"/>
  
  <!-- Black ribbon curves -->
  <path d="M 50 42 Q 65 25, 100 30" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 60 58 Q 70 72, 95 78" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 275 42 Q 260 25, 220 28" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 268 58 Q 255 75, 220 82" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Red bell with 1783 -->
  <circle cx="95" cy="30" r="18" fill="#C41E3A"/>
  <path d="M 85 30 Q 85 38, 95 42 Q 105 38, 105 30" fill="#A01730"/>
  
  <!-- Bell clapper -->
  <ellipse cx="95" cy="38" rx="4" ry="6" fill="#FFD700"/>
  
  <!-- Year text in bell -->
  <text x="95" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">1783</text>
  
  <!-- Schweppes text -->
  <text x="150" y="62" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#1a3a3a" letter-spacing="1">Schweppes</text>
</svg>